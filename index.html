<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Label Batas Makan</title>
<style>
  :root{
    --green:#1E9E5A;
    --dark:#222831;
    --red:#D92D20;
    --gray:#4B5563;
    --line:#B5B5B5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#EEF1F0;
    color:#111;
  }

  /* ---------- Toolbar (hidden on print) ---------- */
  .toolbar{
    max-width:900px;
    margin:24px auto 0;
    background:#fff;
    border-radius:12px;
    padding:20px 24px;
    box-shadow:0 1px 3px rgba(0,0,0,.1);
  }
  .toolbar h1{
    font-size:18px;
    margin:0 0 4px;
  }
  .toolbar p{
    font-size:13px;
    color:var(--gray);
    margin:0 0 16px;
  }
  .fields{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:10px;
  }
  .fields label{
    display:block;
    font-size:11px;
    font-weight:bold;
    color:var(--gray);
    text-transform:uppercase;
    letter-spacing:.03em;
    margin-bottom:4px;
  }
  .fields input, .fields select{
    width:100%;
    padding:8px 10px;
    border:1px solid #D1D5DB;
    border-radius:6px;
    font-size:13px;
    font-family:inherit;
    background:#fff;
  }
  .toolbar-actions{
    margin-top:16px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  button{
    font-family:inherit;
    font-size:13px;
    font-weight:bold;
    border:none;
    border-radius:8px;
    padding:10px 18px;
    cursor:pointer;
  }
  .btn-apply{
    background:var(--green);
    color:#fff;
  }
  .btn-apply:hover{background:#188049;}
  .btn-print{
    background:var(--dark);
    color:#fff;
  }
  .btn-print:hover{background:#000;}
  .hint{
    font-size:12px;
    color:var(--gray);
    margin-top:10px;
  }

  /* ---------- Sheet ---------- */
  .sheet-wrap{
    display:flex;
    justify-content:center;
    padding:24px 0 60px;
  }
  .sheet{
    width:210mm;
    height:297mm;
    background:#fff;
    box-shadow:0 1px 6px rgba(0,0,0,.15);
    display:grid;
    grid-template-columns:105mm 105mm;
    grid-template-rows:repeat(4,74.25mm);
  }
  .label{
    border:1px dashed var(--line);
    margin:0;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    padding:2mm 4mm;
    text-align:center;
    overflow:hidden;
  }
  .label .bar{
    background:var(--green);
    color:#fff;
    font-weight:bold;
    font-size:14px;
    letter-spacing:.04em;
    padding:6px 0;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .label .date{
    font-size:28px;
    font-weight:bold;
    line-height:1.2;
  }
  .label .time{
    font-size:28px;
    font-weight:bold;
    line-height:1.2;
  }
  .label .menu{
    font-size:13px;
    color:var(--gray);
  }
  .label .warning{
    font-size:13px;
    font-weight:bold;
    color:var(--red);
  }
  .label .footer{
    background:var(--dark);
    color:#fff;
    padding:8px 4px;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .label .footer .ts{
    font-size:11px;
    font-weight:bold;
  }
  .label .footer .loc{
    font-size:11px;
    color:#D1D5DB;
    margin-top:2px;
  }
  [contenteditable="true"]{
    outline:none;
    border-radius:3px;
  }
  [contenteditable="true"]:hover{
    background:rgba(30,158,90,.08);
  }
  [contenteditable="true"]:focus{
    background:rgba(30,158,90,.15);
  }

  /* ---------- Print ---------- */
  @media print{
    body{background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    *{-webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;}
    .toolbar{display:none;}
    .sheet-wrap{padding:0;}
    .sheet{
      box-shadow:none;
      margin:0;
      width:210mm;
      height:297mm;
    }
    [contenteditable="true"]:hover,
    [contenteditable="true"]:focus{
      background:transparent;
    }
    @page{
      size:A4;
      margin:0;
    }
  }
</style>
</head>
<body>

  <div class="toolbar" id="toolbar">
    <h1>SAN</h1>
    <div class="fields">
      <div>
        <label>Tanggal</label>
        <input id="f-tanggal" value="11/08/2026">
      </div>
      <div>
        <label>Jam Batas Makan</label>
        <input id="f-jam" value="12.00">
      </div>
      <div>
        <label>Nama Menu</label>
        <input id="f-menu" value="AYAM KECAP">
      </div>
      <div>
        <label>Tipe Porsi</label>
        <select id="f-porsi">
          <option value="PORSI BESAR">PORSI BESAR</option>
          <option value="PORSI KECIL">PORSI KECIL</option>
        </select>
      </div>
      <div>
        <label>Tanggal Cetak</label>
        <input id="f-cetak" value="11/08/2026">
      </div>
      <div>
        <label>Lokasi</label>
        <input id="f-lokasi" value="Karangduak, Sumenep">
      </div>
    </div>
    <div class="toolbar-actions">
      <button class="btn-apply" onclick="applyAll()">Terapkan ke Semua Label</button>
      <button class="btn-print" onclick="window.print()">Cetak / Simpan PDF</button>
    </div>
  </div>

  <div class="sheet-wrap">
    <div class="sheet" id="sheet"></div>
  </div>

<script>
  const LABEL_TEMPLATE = () => `
    <div class="bar">BATAS MAKAN</div>
    <div class="date" contenteditable="true">11/08/2026</div>
    <div class="time" contenteditable="true">12.00 WIB</div>
    <div class="menu" contenteditable="true">AYAM KECAP · PORSI BESAR</div>
    <div class="warning" contenteditable="true">TIDAK UNTUK DIBAWA PULANG</div>
    <div class="footer">
      <div class="ts" contenteditable="true">11/08/2026</div>
      <div class="loc" contenteditable="true">Karangduak, Sumenep</div>
    </div>
  `;

  const sheet = document.getElementById('sheet');
  for(let i=0;i<8;i++){
    const div = document.createElement('div');
    div.className = 'label';
    div.innerHTML = LABEL_TEMPLATE();
    sheet.appendChild(div);
  }

  function todayStr(){
    const d = new Date();
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const yyyy = d.getFullYear();
    return dd + '/' + mm + '/' + yyyy;
  }

  function nowTimeStr(){
    const d = new Date();
    const hh = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return hh + '.' + mi;
  }

  function applyAll(){
    const tanggal = document.getElementById('f-tanggal').value;
    const jam = document.getElementById('f-jam').value;
    const menu = document.getElementById('f-menu').value;
    const porsi = document.getElementById('f-porsi').value;
    const cetak = document.getElementById('f-cetak').value;
    const lokasi = document.getElementById('f-lokasi').value;

    document.querySelectorAll('.label').forEach(label=>{
      label.querySelector('.date').textContent = tanggal;
      label.querySelector('.time').textContent = jam + ' WIB';
      label.querySelector('.menu').textContent = menu + ' · ' + porsi;
      label.querySelector('.ts').textContent = cetak;
      label.querySelector('.loc').textContent = lokasi;
    });
  }

  // Auto-isi tanggal hari ini (tetap bisa diedit manual)
  document.getElementById('f-tanggal').value = todayStr();
  document.getElementById('f-cetak').value = todayStr();

  applyAll();
</script>

</body>
</html>
